version: '3.9'

services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [crm_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [crm_net]

  # ─── MongoDB ──────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: crm_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: crm_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks: [crm_net]

  # ─── API (Node.js) ────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: crm_api
    restart: unless-stopped
    env_file: ./apps/api/.env
    ports:
      - "3001:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [crm_net]
    volumes:
      - uploads_data:/app/uploads

  # ─── Evolution API (WhatsApp) ─────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    container_name: crm_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: https://evolution.seudominio.com
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://crm_user:${POSTGRES_PASSWORD}@postgres:5432/evolution_db
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379
      WEBHOOK_GLOBAL_ENABLED: "false"
      QRCODE_LIMIT: 30
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      postgres: { condition: service_healthy }
    networks: [crm_net]

  # ─── MinIO (Storage) ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: crm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [crm_net]

  # ─── Nginx (Reverse Proxy) ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on: [api, evolution]
    networks: [crm_net]

  # ─── Certbot (SSL) ────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: crm_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  # ─── Portainer (Docker Management) ───────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: crm_portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks: [crm_net]

networks:
  crm_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  evolution_data:
  minio_data:
  uploads_data:
  certbot_data:
  certbot_www:
  portainer_data:
