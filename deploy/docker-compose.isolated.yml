name: dispozapi

services:
  postgres:
    image: postgres:16-alpine
    container_name: dispozapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dispozapi
      POSTGRES_USER: dispozapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dispozapi_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispozapi -d dispozapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dispozapi_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - dispozapi_redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dispozapi_postgres_data:
    name: dispozapi_postgres_data
  dispozapi_redis_data:
    name: dispozapi_redis_data
